name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API — Lint, Migrate, Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: atlas_test
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      INTEGRATION_ENCRYPTION_KEY: ""
      AI_PROVIDER: openai
      AI_MODEL: gpt-4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Lint (Ruff)
        run: |
          cd apps/api
          ruff check .
          ruff format --check .

      - name: Run Alembic migrations
        run: |
          cd apps/api
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head

      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  web:
    name: Web — Type-check, Lint, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Type-check
        run: |
          cd apps/web
          npm run type-check

      - name: Lint
        run: |
          cd apps/web
          npm run lint

      - name: Production build
        run: |
          cd apps/web
          npm run build
